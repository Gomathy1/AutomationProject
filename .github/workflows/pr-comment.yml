name: PR Comment Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  test-presence-check:
    name: Check Test Files
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@v44
      with:
        files: |
          **/*Test.java
          **/*test*.java
          **/*.feature
    
    - name: Count test files
      id: count-tests
      run: |
        UNIT_TESTS=$(find src/test/java/unit -name "*Test.java" 2>/dev/null | wc -l)
        API_TESTS=$(find src/test/java/api -name "*Test.java" 2>/dev/null | wc -l)
        UI_TESTS=$(find src/test/java/ui -name "*Test.java" 2>/dev/null | wc -l)
        echo "unit=$UNIT_TESTS" >> $GITHUB_OUTPUT
        echo "api=$API_TESTS" >> $GITHUB_OUTPUT
        echo "ui=$UI_TESTS" >> $GITHUB_OUTPUT
    
    - name: Comment on PR
      uses: actions/github-script@v7
      with:
        script: |
          const unitTests = '${{ steps.count-tests.outputs.unit }}';
          const apiTests = '${{ steps.count-tests.outputs.api }}';
          const uiTests = '${{ steps.count-tests.outputs.ui }}';
          const changedFiles = '${{ steps.changed-files.outputs.all_changed_files }}';
          
          const totalTests = parseInt(unitTests) + parseInt(apiTests) + parseInt(uiTests);
          let status = '�';
          let message = 'no tests found';
          
          if (totalTests > 0) {
            status = '�';
            message = 'tests found';
          }
          
          const body = `## Test Presence Check: ${message} ${status}
          
          **Unit tests:** ${unitTests > 0 ? unitTests + ' test file(s)' : 'No unit tests found'}
          **API tests:** ${apiTests > 0 ? apiTests + ' test file(s)' : 'No API tests found'}
          **UI tests:** ${uiTests > 0 ? uiTests + ' test file(s)' : 'No UI tests found'}
          **Total:** ${totalTests} test file(s)
          
          ${changedFiles ? '**Changed test files:**\n' + changedFiles.split(' ').map(f => '- `' + f + '`').join('\n') : ''}`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });
  
  code-quality-check:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Build project
      run: mvn clean compile
    
    - name: Comment build status
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const status = '${{ job.status }}' === 'success' ? '✅' : '❌';
          const body = `## Build Status ${status}\n\nBuild ${status === '✅' ? 'passed' : 'failed'}`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });
